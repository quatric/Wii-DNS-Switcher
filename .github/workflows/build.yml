name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Wii Binaries
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dolxz build dependencies
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev liblzma-dev pkg-config curl ca-certificates

      - name: Install host tools
        run: apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates

      - name: Build optional controller libraries
        run: ./scripts/build_controller_portlibs.sh

      - name: Build DOL (all controllers)
        run: make WITH_WIIDRC=1 WITH_WUPC=1 WITH_SICKSAXIS=1

      - name: Package Homebrew Channel app
        run: make package WITH_WIIDRC=1 WITH_WUPC=1 WITH_SICKSAXIS=1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wii-DNS-Switcher
          path: |
            dns-switcher.dol
            dns-switcher-xz.dol
            dist/apps/dns-switcher
      - name: Zip the release
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends zip
          (cd dist && zip -r "$GITHUB_WORKSPACE/Wii-DNS-Switcher.zip" apps)
      - uses: actions/upload-artifact@v4
        with:
          name: release-Wii-DNS-Switcher
          if-no-files-found: error
          path: |
            Wii-DNS-Switcher.zip
            dns-switcher.dol
            dns-switcher-xz.dol

  # Every push to the default branch refreshes the "latest" release; tags like v1.2.0 also get their own release.
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-Wii-DNS-Switcher
          path: out
      - name: Move the latest tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish latest release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wii DNS Switcher (latest)
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Latest build of Wii DNS Switcher from ${{ github.sha }}.

            Extract Wii-DNS-Switcher.zip to the root of your SD card (or USB drive) and open Wii DNS Switcher from the Homebrew Channel.
          files: |
            out/Wii-DNS-Switcher.zip
            out/dns-switcher.dol
            out/dns-switcher-xz.dol
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Wii DNS Switcher ${{ github.ref_name }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Extract Wii-DNS-Switcher.zip to the root of your SD card (or USB drive) and open Wii DNS Switcher from the Homebrew Channel.
          files: |
            out/Wii-DNS-Switcher.zip
            out/dns-switcher.dol
            out/dns-switcher-xz.dol
