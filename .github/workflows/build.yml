name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Wii Binaries
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dolxz build dependencies
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev liblzma-dev pkg-config curl ca-certificates

      - name: Install host tools
        run: apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates

      - name: Build optional controller libraries
        run: ./scripts/build_controller_portlibs.sh

      - name: Build DOL (all controllers)
        run: make WITH_WIIDRC=1 WITH_WUPC=1 WITH_SICKSAXIS=1

      - name: Package Homebrew Channel app
        run: make package WITH_WIIDRC=1 WITH_WUPC=1 WITH_SICKSAXIS=1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wii-DNS-Switcher
          path: |
            dns-switcher.dol
            dns-switcher-xz.dol
            dist/apps/dns-switcher

      - name: Zip release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends zip
          (cd dist && zip -r "$GITHUB_WORKSPACE/Wii-DNS-Switcher.zip" apps)

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Wii-DNS-Switcher.zip
            dns-switcher.dol
            dns-switcher-xz.dol
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
